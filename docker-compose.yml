services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      - PORT=${PORT:-8081}
      - DB_PATH=/app/data/blink.db
      - TRUST_PROXY=${TRUST_PROXY:-false}
    profiles:
      - prod
