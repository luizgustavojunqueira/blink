app = "blinkapp"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8081"
  DB_PATH = "/app/data/blink.db"
  TRUST_PROXY = "true"

[[mounts]]
  source = "blink_data"
  destination = "/app/data"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
