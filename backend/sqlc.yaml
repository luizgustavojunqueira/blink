version: "2"
sql:
  - schema: "internal/db/migrations"
    queries: "internal/db/query.sql"
    engine: "sqlite"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
