services:
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/blink.db
    profiles:
      - prod

  dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/blink.db
    profiles:
      - dev
